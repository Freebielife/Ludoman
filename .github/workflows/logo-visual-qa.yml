name: Ludoman visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'assets/icon-pack/**'
      - 'scripts/icon_pack.py'
      - 'tests/**'
      - '.github/workflows/logo-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unit checks
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
      - name: Build standalone Ludoman
        run: |
          python3 build.py
          python3 verify.py
      - name: Install Chromium browser test runner
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Check offline rendering and responsive controls
        run: python3 tests/browser_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ludoman-logo-previews
          path: build/screenshots/
          if-no-files-found: ignore
          retention-days: 7
