name: Build Ludoman redesign preview
on:
  push:
    branches:
      - design/telegram-taste-v1-20261117
    paths:
      - 'web/**'
      - 'build.py'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/design-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ludoman-design-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run JavaScript unit tests
        run: node --test tests/*.test.cjs
      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build self-contained design preview
        run: |
          python3 build.py
          python3 verify.py
      - name: Commit preview HTML to design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build preview HTML for Telegram Taste redesign"
            git push
          fi
