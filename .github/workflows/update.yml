name: Refresh LUDOMAN data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: ludoman-market-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 20
      - name: Verify snapshot loader and market cap
        run: node --test tests/*.test.cjs
      - name: Verify domain ownership and refresh queue
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Collect market activity
        id: collect
        continue-on-error: true
        run: python3 collect.py
      - name: Build standalone page and publish available data
        run: |
          test -s data/snapshot.json
          python3 build.py
          python3 verify.py
          python3 scripts/publish_snapshot.py
      - name: Flag partial collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
